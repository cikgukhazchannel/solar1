<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hand Tracking - Planet Templates</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020205; /* Deep space */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            pointer-events: none;
            background: rgba(10, 10, 15, 0.75);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffaa00;
        }
        p {
            margin: 8px 0;
            font-size: 0.95rem;
            color: #e0e0e0;
        }
        #status {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            color: #00ffcc;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #00ffcc;
        }
        /* Hidden video element for MediaPipe AI */
        .input_video {
            display: none;
        }
    </style>
    
    <!-- Three.js for 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- MediaPipe for AI Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="status">Loading AI Models & Camera...</div>

    <div class="ui-container">
        <h1 id="template-name">Template: The Sun</h1>
        <p>🖐️ <b>Move Hand Left/Right:</b> Change Color</p>
        <p>🤏 <b>Pinch Index + Thumb:</b> Expand/Scale Planet</p>
        <p>🤙 <b>Pinch Pinky + Thumb:</b> Switch Planet</p>
    </div>

    <video class="input_video" autoplay playsinline></video>
    <div id="canvas-container"></div>

    <script>
        // --- 1. THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7;
        camera.position.y = 1; 
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- 2. PARTICLE SYSTEM ---
        const numParticles = 12000;
        const geometry = new THREE.BufferGeometry();
        
        const currentPositions = new Float32Array(numParticles * 3);
        geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

        const material = new THREE.PointsMaterial({
            size: 0.04,
            color: 0xffaa00,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 3. PLANETARY MATHEMATICS (TEMPLATES) ---
        
        // Helper function for solid sphere distribution
        function getSphere(radius) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * 2 * Math.PI;
            const r = radius * Math.cbrt(Math.random()); // Even volume distribution
            return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi), phi, theta };
        }

        function getSun() {
            const arr = new Float32Array(numParticles * 3);
            for(let i = 0; i < numParticles; i++) {
                // 80% Core, 20% Solar flares/corona
                const radius = Math.random() > 0.8 ? (3.0 + Math.random() * 0.8) : 3.0;
                const p = getSphere(radius);
                arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
            }
            return arr;
        }

        function getMercury() {
            const arr = new Float32Array(numParticles * 3);
            for(let i = 0; i < numParticles; i++) {
                const p = getSphere(0.8); // Very small
                arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
            }
            return arr;
        }

        function getVenus() {
            const arr = new Float32Array(numParticles * 3);
            for(let i = 0; i < numParticles; i++) {
                const p = getSphere(1.5); // Dense atmosphere
                arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
            }
            return arr;
        }

        function getEarth() {
            const arr = new Float32Array(numParticles * 3);
            const earthCount = Math.floor(numParticles * 0.85); // 85% Earth, 15% Moon
            for(let i = 0; i < numParticles; i++) {
                if (i < earthCount) {
                    const p = getSphere(1.6);
                    arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
                } else {
                    const p = getSphere(0.4);
                    // Offset moon by 3 units on the X axis
                    arr[i*3] = p.x + 3.0; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
                }
            }
            return arr;
        }

        function getMars() {
            const arr = new Float32Array(numParticles * 3);
            for(let i = 0; i < numParticles; i++) {
                const p = getSphere(1.1);
                arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
            }
            return arr;
        }

        function getJupiter() {
            const arr = new Float32Array(numParticles * 3);
            for(let i = 0; i < numParticles; i++) {
                const p = getSphere(2.8); // Giant planet
                
                // Create atmospheric bands based on latitude (Y-axis)
                let r = 2.8 * Math.cbrt(Math.random());
                if (Math.random() > 0.4) {
                    const lat = Math.abs(Math.cos(p.phi));
                    // Indent certain latitudes to create "bands"
                    if ((lat > 0.15 && lat < 0.25) || (lat > 0.45 && lat < 0.55) || (lat > 0.7 && lat < 0.75)) {
                        r = 2.65; 
                    } else {
                        r = 2.8; // Surface
                    }
                }
                
                arr[i*3] = r * Math.sin(p.phi) * Math.cos(p.theta);
                arr[i*3+1] = r * Math.sin(p.phi) * Math.sin(p.theta);
                arr[i*3+2] = r * Math.cos(p.phi);
            }
            return arr;
        }

        function getSaturn() {
            const arr = new Float32Array(numParticles * 3);
            const coreCount = Math.floor(numParticles * 0.45);
            for(let i = 0; i < numParticles; i++) {
                if (i < coreCount) {
                    const p = getSphere(2.0); // Core planet
                    arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
                } else {
                    // Wide Rings
                    const theta = Math.random() * 2 * Math.PI;
                    const r = 2.8 + Math.random() * 2.5; // Inner radius 2.8, Outer 5.3
                    arr[i*3] = r * Math.cos(theta);
                    arr[i*3+1] = (Math.random() - 0.5) * 0.1; // Flat rings
                    arr[i*3+2] = r * Math.sin(theta);
                }
            }
            return arr;
        }

        // Register templates
        const templates = [
            { name: "The Sun", data: getSun() },
            { name: "Mercury", data: getMercury() },
            { name: "Venus", data: getVenus() },
            { name: "Earth & Moon", data: getEarth() },
            { name: "Mars", data: getMars() },
            { name: "Jupiter", data: getJupiter() },
            { name: "Saturn", data: getSaturn() }
        ];

        let currentTemplateIndex = 0;
        let activeTarget = templates[currentTemplateIndex].data;

        function setTemplate(index) {
            currentTemplateIndex = index % templates.length;
            activeTarget = templates[currentTemplateIndex].data;
            document.getElementById('template-name').innerText = "Template: " + templates[currentTemplateIndex].name;
        }

        // Initialize starting positions
        for(let i = 0; i < currentPositions.length; i++) {
            currentPositions[i] = activeTarget[i];
        }

        // --- 4. GESTURE CONTROLS & STATE ---
        let targetExpansion = 1.0;
        let currentExpansion = 1.0;
        let targetHue = 0.1; // Start slightly orange for the Sun
        let currentHue = 0.1;
        let isSwitchingTemplate = false;

        // --- 5. MEDIAPIPE AI HAND TRACKING ---
        const videoElement = document.getElementsByClassName('input_video')[0];
        
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            document.getElementById('status').style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                const wrist = landmarks[0];
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const pinkyTip = landmarks[20];

                // 1. Color Control (Map horizontal wrist position to color Hue)
                targetHue = 1.0 - wrist.x; // Inverted because webcam is mirrored

                // 2. Expansion Control (Distance between Thumb and Index)
                const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                // Map distance to scale (Min 0.3x, Max 2.5x)
                targetExpansion = Math.max(0.3, Math.min(2.5, (pinchDist - 0.02) * 12 + 0.5));

                // 3. Template Switch Control (Distance between Thumb and Pinky)
                const pinkyPinchDist = Math.hypot(thumbTip.x - pinkyTip.x, thumbTip.y - pinkyTip.y);
                
                if (pinkyPinchDist < 0.05 && !isSwitchingTemplate) {
                    isSwitchingTemplate = true;
                    setTemplate(currentTemplateIndex + 1);
                    
                    // 1-second cooldown
                    setTimeout(() => {
                        isSwitchingTemplate = false;
                    }, 1000); 
                }
            }
        });

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        cameraFeed.start();

        // --- 6. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Smoothly interpolate expansion and color
            currentExpansion += (targetExpansion - currentExpansion) * 0.1;
            currentHue += (targetHue - currentHue) * 0.05;
            
            material.color.setHSL(currentHue, 1.0, 0.6);

            // Slowly orbit/rotate the planet
            particles.rotation.y -= 0.004;
            particles.rotation.x = 0.1; // Slight tilt

            // Interpolate particle positions toward active planet template
            for(let i = 0; i < currentPositions.length; i++) {
                const target = activeTarget[i] * currentExpansion;
                currentPositions[i] += (target - currentPositions[i]) * 0.06; // Morph speed
            }
            
            geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        animate();

        // --- 7. RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
